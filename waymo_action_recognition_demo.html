<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Driving-Action Recognition — Evaluation Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;        /* soft off-white sand */
    --paper-hi:#FCFAF4;     /* raised card, near-white */
    --mat:#DED6C1;          /* video mat / sunken */
    --ink:#221F17;          /* warm near-black text */
    --ink-soft:#726A57;     /* muted */
    --line:#DED5C1;         /* hairline */
    --line-soft:#EBE4D5;
    --signal:#9A6B12;       /* bronze/ochre — locked & live state (not terracotta) */
    --sage:#5C7350;         /* correct */
    --clay:#9A5238;         /* incorrect */
    --serif:'Spectral', Georgia, serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);}
  body{font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1060px;margin:0 auto;padding:34px 26px 70px;}

  /* header */
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px;}
  h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.04;letter-spacing:-.01em;margin:0;white-space:nowrap;}
  h1 em{font-style:italic;color:var(--ink);}
  .progress{display:flex;gap:9px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);white-space:nowrap;}
  .dots{display:flex;gap:7px;}
  .dot{width:9px;height:9px;border:1px solid var(--ink);border-radius:50%;background:transparent;transition:background .3s;}
  .dot.done{background:var(--ink);}
  .dot.active{background:var(--signal);border-color:var(--signal);}

  /* stage */
  .stage{position:relative;background:var(--mat);border:1px solid var(--line);
    aspect-ratio:16/9;overflow:hidden;}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#111;
    transition:filter .5s ease;}
  .stage.locked video{filter:saturate(.62) contrast(1.02) brightness(.98);}

  /* registration / crop marks — the signature freeze treatment */
  .marks{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease;}
  .stage.locked .marks{opacity:1;}
  .mk{position:absolute;width:20px;height:20px;}
  .mk::before,.mk::after{content:"";position:absolute;background:var(--paper);box-shadow:0 0 0 .5px rgba(34,31,23,.5);}
  .mk::before{width:20px;height:1.5px;} .mk::after{width:1.5px;height:20px;}
  .mk.tl{top:10px;left:10px;} .mk.tr{top:10px;right:10px;} .mk.tr::before{right:0;} .mk.tr::after{right:0;}
  .mk.bl{bottom:10px;left:10px;} .mk.bl::before{bottom:0;} .mk.bl::after{bottom:0;}
  .mk.br{bottom:10px;right:10px;} .mk.br::before{right:0;bottom:0;} .mk.br::after{right:0;bottom:0;}
  .cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;}
  .cross::before,.cross::after{content:"";position:absolute;background:var(--paper);opacity:.85;box-shadow:0 0 0 .5px rgba(34,31,23,.4);}
  .cross::before{left:50%;top:0;width:1px;height:30px;transform:translateX(-.5px);}
  .cross::after{top:50%;left:0;height:1px;width:30px;transform:translateY(-.5px);}

  .tc{position:absolute;left:12px;bottom:11px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--paper);background:rgba(34,31,23,.62);padding:4px 9px;border-radius:2px;}
  .stage.locked .tc{color:var(--signal);background:rgba(34,31,23,.82);}
  .tc .rec{display:none;} .stage.locked .tc .rec{display:inline;color:var(--signal);}

  /* empty state */
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;color:var(--paper);background:var(--mat);padding:20px;}
  .empty strong{font-family:var(--serif);font-size:18px;font-weight:400;}
  .empty span{font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.85;}
  .empty.hide{display:none;}

  /* begin overlay */
  .begin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(34,31,23,.34);
    transition:opacity .4s;}
  .begin.hide{opacity:0;pointer-events:none;}

  /* decision block */
  .decision{margin-top:24px;min-height:2px;}
  .qline{display:flex;align-items:baseline;gap:14px;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;}
  .decision.show .qline{opacity:1;transform:none;}
  .qtag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--signal);white-space:nowrap;}
  .q{font-family:var(--serif);font-style:italic;font-weight:400;font-size:23px;line-height:1.25;margin:0;}

  /* action rail */
  .rail{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px;opacity:0;transition:opacity .5s .08s;}
  .decision.show .rail{opacity:1;}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;border:1px solid var(--line);
    background:var(--paper-hi);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);border-radius:2px;transition:.25s;}
  .chip svg{width:15px;height:15px;flex:none;}
  .chip.is-truth{border-color:var(--sage);color:var(--ink);box-shadow:inset 0 0 0 1px var(--sage);}
  .chip.is-truth .tick{display:inline;}
  .chip .tick{display:none;margin-left:2px;color:var(--sage);font-weight:600;}
  .railnote{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:10px 0 0;letter-spacing:.04em;opacity:0;transition:opacity .4s;}
  .decision.truth .railnote{opacity:1;}

  /* model cards */
  .models{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px;}
  .card{border:1px solid var(--line);background:var(--paper-hi);padding:16px 16px 14px;
    opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s,border-color .35s,box-shadow .35s;}
  .decision.reveal .card,.decision.truth .card{opacity:1;transform:none;}
  .card{transition-delay:calc(var(--i) * .09s);}
  .card-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-soft);padding-bottom:9px;margin-bottom:11px;}
  .mname{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink);}
  .mkind{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .reason{font-family:var(--serif);font-size:14.5px;line-height:1.5;color:#332f24;margin:0 0 14px;min-height:63px;}
  .pred{display:flex;align-items:center;gap:9px;}
  .predlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}
  .pred .chip{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .pred .chip svg{color:var(--paper);}
  .verdict{font-family:var(--mono);font-size:11px;letter-spacing:.1em;opacity:0;transition:opacity .4s;}
  .decision.reveal .verdict,.decision.truth .verdict{opacity:1;}
  .card.correct{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage);}
  .card.correct .verdict{color:var(--sage);}
  .card.correct .pred .chip{background:var(--sage);border-color:var(--sage);}
  .card.wrong{border-color:var(--clay);box-shadow:inset 0 0 0 1px var(--clay);}
  .card.wrong .verdict{color:var(--clay);}
  .card.wrong .pred .chip{background:var(--clay);border-color:var(--clay);}

  /* controls */
  .bar{display:flex;align-items:center;gap:16px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);}
  .btn{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:12px 26px;border-radius:2px;cursor:pointer;transition:.18s;}
  .btn:hover{background:#171510;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.ghost:hover{background:rgba(34,31,23,.06);}
  .hint{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-soft);}
  .hint kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:1px 5px;background:var(--paper-hi);font-size:10px;}

  /* end card */
  .end{margin-top:26px;border:1px solid var(--line);background:var(--paper-hi);padding:24px;display:none;}
  .end.show{display:block;}
  .end h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 4px;}
  .end p{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin:0 0 18px;letter-spacing:.03em;}
  .tally{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;}
  .tally td{padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .tally td:last-child{text-align:right;font-weight:600;}
  .tally tr:last-child td{border-bottom:none;}
  .tally tr.hit td:last-child{color:var(--sage);}
  .tally tr.miss td:last-child{color:var(--clay);}

  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  @media (max-width:760px){
    h1{font-size:23px;white-space:normal;} .head{flex-direction:column;align-items:flex-start;gap:12px;}
    .models{grid-template-columns:1fr;} .q{font-size:20px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Waymo from the street · action recognition</p>
  <div class="head">
    <h1>Reading the action <em>as</em> it happens</h1>
    <div class="progress"><span id="pcount">01 / 01</span><span class="dots" id="dots"></span></div>
  </div>

  <div class="stage" id="stage">
    <video id="video" src="waymo_13s.mp4" preload="auto" playsinline muted></video>
    <div class="marks">
      <span class="mk tl"></span><span class="mk tr"></span><span class="mk bl"></span><span class="mk br"></span>
      <span class="cross"></span>
    </div>
    <div class="tc" id="tc"><span class="rec">● LOCKED&nbsp;&nbsp;</span><span id="tctime">00:00.0</span></div>
    <div class="empty hide" id="empty">
      <strong>Clip not found</strong>
      <span>Keep waymo_13s.mp4 beside this file, or drop it here</span>
    </div>
    <div class="begin" id="begin">
      <button class="btn" id="beginBtn">Begin evaluation</button>
    </div>
  </div>

  <div class="decision" id="decision">
    <div class="qline"><span class="qtag" id="qtag">Segment 01</span><p class="q" id="q"></p></div>
    <div class="rail" id="rail"></div>
    <p class="railnote" id="railnote"></p>
    <div class="models" id="models"></div>
  </div>

  <div class="bar" id="bar">
    <button class="btn" id="primary">Begin evaluation</button>
    <span class="hint"><kbd>Space</kbd> advances · audio is muted</span>
  </div>

  <div class="end" id="end">
    <h2>Evaluation complete</h2>
    <p>Predicted action vs. ground truth on the 13s–end clip</p>
    <table class="tally" id="tally"></table>
  </div>
</div>

<script>
/* ============================================================================
   EDIT ME — the whole demo is driven by this object.

   Single clip: waymo_13s.mp4 (trimmed from 13 s to end of waymo.mp4, ~7 s).
   Replace each model's reasoning, action, and latency_sec with eval outputs.
   action ids: accelerate | decelerate | turn_left | turn_right | near_miss
   ========================================================================== */
const CLIP_START = 0.0;
const DATA = {
  actions: [
    {id:"accelerate", label:"Accelerate"},
    {id:"decelerate", label:"Decelerate"},
    {id:"turn_left",  label:"Turn left"},
    {id:"turn_right", label:"Turn right"},
    {id:"near_miss",  label:"Near miss"},
  ],
  points: [
    {
      t_start: 0.0,
      t: 7.0,
      question: "What is the autonomous vehicle doing in this scene? Choose from one of these actions.",
      groundTruth: "turn_right",
      models: [
        {name:"Qwen3.5-9B", latency_sec:2.28,
         reasoning:"The white autonomous vehicle is positioned at an intersection and begins to rotate its wheels and body to the right, indicating it is executing a right turn across the crosswalk.",
         action:"turn_right"},
        {name:"InternVL3.5-8B", latency_sec:2.86,
         reasoning:"The autonomous vehicle is positioned at an intersection and appears to be turning left onto the cross street.",
         action:"turn_left"},
        {name:"LLaVA-OneVision-7B", latency_sec:2.13,
         reasoning:"The autonomous vehicle is turning right at the intersection, as indicated by its position and the direction of its wheels.",
         action:"turn_right"},
      ],
    },
  ],
};

/* ---- icons ---- */
const ICON = {
  accelerate:'<path d="M8 13V3M8 3L4.5 6.5M8 3l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  decelerate:'<path d="M8 3v10M8 13l-3.5-3.5M8 13l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  turn_left:'<path d="M11 13V8a3 3 0 0 0-3-3H4M4 5l3-3M4 5l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  turn_right:'<path d="M5 13V8a3 3 0 0 1 3-3h4M12 5L9 2M12 5L9 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  near_miss:'<path d="M8 2.5 14 13H2L8 2.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 7v3.2M8 11.6v.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
};
const label = id => DATA.actions.find(a=>a.id===id)?.label || id;
function fmtLatency(sec){
  if(sec == null || sec === 0) return "—";
  return sec >= 10 ? `${sec.toFixed(1)} s` : `${sec.toFixed(2)} s`;
}
function chip(id, cls=""){
  return `<span class="chip ${cls}" data-action="${id}"><svg viewBox="0 0 16 16">${ICON[id]||""}</svg>${label(id)}<span class="tick">✓</span></span>`;
}

/* ---- elements ---- */
const $ = s => document.querySelector(s);
const video=$("#video"), stage=$("#stage"), decision=$("#decision"),
      primary=$("#primary"), begin=$("#begin"), beginBtn=$("#beginBtn"),
      tctime=$("#tctime"), rail=$("#rail"), models=$("#models"),
      qEl=$("#q"), qtag=$("#qtag"), railnote=$("#railnote"),
      dots=$("#dots"), pcount=$("#pcount"), endCard=$("#end"), tally=$("#tally"), empty=$("#empty");

let idx=0, phase="idle";
const scores = DATA.points[0].models.map(m=>({name:m.name, correct:0, total:0}));

/* build progress dots + action rail */
DATA.points.forEach(()=>{const d=document.createElement("span");d.className="dot";dots.appendChild(d);});
rail.innerHTML = DATA.actions.map(a=>chip(a.id)).join("");

function fmt(t){const m=Math.floor(t/60),s=(t%60);return `${String(m).padStart(2,"0")}:${s.toFixed(1).padStart(4,"0")}`;}
video.addEventListener("timeupdate",()=>{ tctime.textContent=fmt(video.currentTime||0); });
video.addEventListener("canplay",()=>{ empty.classList.add("hide"); });
video.addEventListener("error",()=>{
  if(!video.dataset.fallback){
    video.dataset.fallback="1";
    video.src="waymo.mp4#t=13";
    DATA.points[0].t_start=13;
    video.load();
    return;
  }
  empty.classList.remove("hide");
});

/* drag/drop fallback if the clip isn't beside the file */
["dragover","dragenter"].forEach(e=>stage.addEventListener(e,ev=>ev.preventDefault()));
stage.addEventListener("drop",ev=>{ev.preventDefault();const f=ev.dataTransfer.files[0];
  if(f){ video.src=URL.createObjectURL(f); empty.classList.add("hide"); }});

function updateProgress(){
  pcount.textContent = `${String(idx+1).padStart(2,"0")} / ${String(DATA.points.length).padStart(2,"0")}`;
  [...dots.children].forEach((d,i)=>{ d.className="dot"+(i<idx?" done":i===idx?" active":""); });
}

function renderDecision(){
  const p=DATA.points[idx];
  qtag.textContent=`Segment ${String(idx+1).padStart(2,"0")}`;
  qEl.textContent=p.question;
  [...rail.children].forEach(c=>c.classList.remove("is-truth"));
  railnote.textContent="";
  models.innerHTML = p.models.map((m,i)=>`
    <article class="card" style="--i:${i}">
      <div class="card-top"><span class="mname">${m.name}</span><span class="mkind">${fmtLatency(m.latency_sec)}</span></div>
      <p class="reason">${m.reasoning}</p>
      <div class="pred">
        <span class="predlabel">recognises</span>${chip(m.action)}
        <span class="verdict" style="margin-left:auto"></span>
      </div>
    </article>`).join("");
}

function applyCardVerdicts(){
  const p=DATA.points[idx];
  const cards=[...models.children];
  p.models.forEach((m,i)=>{
    const ok=m.action===p.groundTruth;
    cards[i].classList.toggle("correct", ok);
    cards[i].classList.toggle("wrong", !ok);
    cards[i].querySelector(".verdict").textContent = ok?"correct":"missed";
  });
}

/* phase machine */
function toDecide(){
  phase="decide"; stage.classList.add("locked"); video.pause();
  renderDecision();
  decision.className="decision show";
  primary.textContent="Reveal recognitions";
  updateProgress();
}
function toReveal(){
  phase="reveal"; decision.className="decision show reveal";
  applyCardVerdicts();
  primary.textContent="Show ground truth";
}
function toTruth(){
  phase="truth"; const p=DATA.points[idx];
  decision.className="decision show reveal truth";
  [...rail.children].forEach(c=>c.classList.toggle("is-truth", c.dataset.action===p.groundTruth));
  railnote.textContent = `Ground truth · ${label(p.groundTruth)}`;
  p.models.forEach((m,i)=>{
    const ok=m.action===p.groundTruth;
    scores[i].total++; if(ok) scores[i].correct++;
  });
  primary.textContent = "Finish";
}
let playMode="decision";
function clearWatch(){ if(video._watch){ video.removeEventListener("timeupdate",video._watch); video._watch=null; } }
function playUntil(stopAt, onArrive){
  clearWatch();
  const watch=()=>{ if(video.currentTime>=stopAt-0.03){ clearWatch(); onArrive(); } };
  video._watch=watch; video.addEventListener("timeupdate",watch); video.play().catch(()=>{});
}
function seekClipStart(){
  const t = DATA.points[0].t_start ?? CLIP_START;
  if(video.currentTime < t - 0.05) video.currentTime = t;
}
function startPlaying(){
  begin.classList.add("hide"); phase="playing"; playMode="decision";
  primary.textContent="Skip to end";
  seekClipStart();
  const stopAt = video.duration && isFinite(video.duration)
    ? video.duration - 0.05
    : (DATA.points[0].t ?? 7);
  playUntil(stopAt, toDecide);
}
function toContinue(){
  clearWatch();
  video.pause();
  finish();
}
function skipToDecision(){
  clearWatch();
  video.pause();
  if(playMode==="end") finish(); else toDecide();
}
function finish(){
  phase="done";
  clearWatch();
  video.pause();
  stage.classList.add("locked");
  decision.className="decision";
  [...dots.children].forEach(d=>d.className="dot done");
  tally.innerHTML = scores.map((s,i)=>{
    const ok = s.correct === s.total && s.total > 0;
  return `<tr class="${ok?"hit":"miss"}"><td>${s.name}</td><td>${s.correct} / ${s.total}</td></tr>`;
  }).join("");
  endCard.classList.add("show");
  primary.textContent="Replay";
  endCard.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function replay(){
  idx=0; scores.forEach(s=>{s.correct=0;s.total=0;});
  endCard.classList.remove("show"); decision.className="decision";
  stage.classList.remove("locked"); video.currentTime = DATA.points[0].t_start ?? CLIP_START;
  updateProgress();
  begin.classList.remove("hide"); phase="idle"; primary.textContent="Begin evaluation";
}

video.addEventListener("loadedmetadata", ()=>{
  const p = DATA.points[0];
  if(video.duration && isFinite(video.duration)) p.t = video.duration;
  empty.classList.add("hide");
});

primary.addEventListener("click",advance);
beginBtn.addEventListener("click",()=>{ if(phase==="idle") startPlaying(); });
function advance(){
  switch(phase){
    case "idle":     startPlaying(); break;
    case "playing":  skipToDecision(); break;
    case "decide":   toReveal(); break;
    case "reveal":   toTruth(); break;
    case "truth":    toContinue(); break;
    case "done":     replay(); break;
  }
}
document.addEventListener("keydown",e=>{
  if(e.code==="Space" && e.target.tagName!=="BUTTON"){ e.preventDefault(); advance(); }
});

updateProgress();
</script>
</body>
</html>
