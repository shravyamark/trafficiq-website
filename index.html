<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TrafficIQ</title>
  <meta
    name="description"
    content="TrafficIQ provides intelligent transportation and traffic analytics solutions."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 64px 40px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(42px, 8vw, 72px);
    }

    p {
      margin: 0 auto;
      max-width: 600px;
      font-size: 20px;
      line-height: 1.6;
      color: #526078;
    }
  </style>
</head>

<body>
  <main>
    <h1>TrafficIQ</h1>
    <p>
      Intelligent transportation solutions for safer, more efficient streets.
      Our new website is coming soon.
    </p>
  </main>
</body>
</html>
